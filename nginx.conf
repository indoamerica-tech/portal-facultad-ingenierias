server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik termina el TLS y nos habla por HTTP. Sin esto, nginx construye
    # los redirects como "http://host/..." y degrada la conexión del visitante.
    absolute_redirect off;
    port_in_redirect off;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # ---------- Compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # ---------- Cabeceras ----------
    # OJO: en nginx, un `add_header` dentro de un `location` DESCARTA todos los
    # `add_header` heredados del server. Por eso las cabeceras de seguridad se
    # repiten en cada location que añade las suyas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # El HTML no se cachea: un redeploy se ve al instante.
    add_header Cache-Control "no-cache, must-revalidate" always;

    # ---------- Rutas ----------
    # Astro genera /carreras/index.html. Servimos ese fichero directamente en
    # lugar de dejar que nginx redirija a la barra final: los enlaces internos
    # apuntan sin barra, y así cada navegación se ahorra un 301.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Solo /_astro/ lleva hash de contenido en el nombre. Ahí, y SOLO ahí,
    # es seguro cachear para siempre.
    location /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        access_log off;
    }

    # Los ficheros de marca tienen nombre FIJO: si se cachean 30 días, cambiar
    # el favicon deja a los visitantes (y a Cloudflare) con el antiguo durante
    # un mes. Cache corta + revalidación; nginx ya envía ETag y Last-Modified,
    # así que la revalidación normalmente cuesta un 304 vacío.
    # OJO: debe ir ANTES del bloque genérico de assets — en nginx gana la
    # primera expresión regular que coincide, no la más específica.
    location ~ ^/(favicon\.(svg|ico)|apple-touch-icon\.png|og-image\.png|site\.webmanifest)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public" always;
        expires 30d;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
