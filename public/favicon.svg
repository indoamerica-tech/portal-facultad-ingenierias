<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Facultad de Ingenierías — Universidad Indoamérica">
  <title>Facultad de Ingenierías</title>

  <defs>
    <!-- Dorado -> naranja: los dos acentos institucionales de Indoamérica -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9A01B"/>
      <stop offset="58%" stop-color="#EA600A"/>
      <stop offset="100%" stop-color="#D45408"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#brand)"/>

  <!-- Triada de nodos enlazados: la unidad mínima de una estructura, y el
       mismo lenguaje que la red animada del hero. Los nodos macizos siguen
       leyéndose a 16px, donde un trazo fino se convertiría en una mancha. -->
  <g fill="#FFFFFF">
    <path d="M32 17 16 46h32z" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="32" cy="17" r="7.2"/>
    <circle cx="16" cy="46" r="7.2"/>
    <circle cx="48" cy="46" r="7.2"/>
  </g>
</svg>
